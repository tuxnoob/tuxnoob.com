<style>
  /* Blur background content when AdBlock is detected */
  body.adblock-detected main,
  body.adblock-detected header,
  body.adblock-detected footer {
    filter: blur(5px);
    pointer-events: none;
    user-select: none;
  }

  /* Fullscreen watermark text */
  #adblock-watermark {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 99998;
    pointer-events: none;
    background: repeating-linear-gradient(
      rgba(255, 0, 0, 0.15) 0,
      rgba(255, 0, 0, 0.15) 1px,
      transparent 1px,
      transparent 40px
    );
  }
  #adblock-watermark::before {
    content: "ADBLOCK DETECTED";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-30deg);
    font-size: 6vw;
    color: rgba(255, 0, 0, 0.15);
    font-weight: bold;
    white-space: nowrap;
  }

  /* Fullscreen overlay for modal */
  #adblock-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }

  /* Modal box */
  #adblock-modal {
    background: white;
    color: black;
    padding: 30px 40px;
    max-width: 400px;
    text-align: center;
    border-radius: 12px;
    font-family: sans-serif;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    animation: fadeIn 0.4s ease;
  }

  #adblock-modal h2 {
    margin-top: 0;
    font-size: 24px;
  }

  #adblock-modal p {
    font-size: 16px;
    margin-bottom: 0;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div id="adblock-watermark"></div>

<div id="adblock-overlay">
  <div id="adblock-modal">
    <h2>🚫 Ad Blocker Detected</h2>
    <p>
      We've detected you are using an ad blocker.<br>
      Please disable it to view our content, and the ads will not bother you. Thanks
    </p>
  </div>
</div>

<script>
(function(){
  function showOverlay() {
    document.body.classList.add('adblock-detected');
    document.getElementById('adblock-overlay').style.display = 'flex';
    document.getElementById('adblock-watermark').style.display = 'block';
    document.body.style.overflow = 'hidden'; // prevent scrolling
  }

  // --- Method 1: Bait Script ---
  var baitScript = document.createElement('script');
  baitScript.src = '/ads/ad-banner.js';
  baitScript.onerror = function() {
    showOverlay();
  };
  document.head.appendChild(baitScript);

  // --- Method 2: Bait Element ---
  var baitDiv = document.createElement('div');
  baitDiv.className = 'adsbox';
  baitDiv.style.height = '1px';
  baitDiv.style.position = 'absolute';
  baitDiv.style.left = '-999px';
  document.body.appendChild(baitDiv);

  // Check after short delay
  setTimeout(function(){
    var scriptFound = Array.from(document.getElementsByTagName('script'))
                            .some(s => s.src.includes('ad-banner.js'));
    var elementBlocked = (baitDiv.offsetHeight === 0);

    if (!scriptFound || elementBlocked) {
      showOverlay();
    }

    baitDiv.remove();
  }, 300);
})();
</script>
