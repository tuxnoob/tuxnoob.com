<!-- _includes/adblock-check.html -->
<!-- Put this right after <body> in your default layout -->
<div id="ab-overlay" aria-hidden="false" role="dialog" aria-label="Adblock check">
  <div id="ab-modal">
    <h2 id="ab-title">Checking for ad blocker…</h2>
    <p id="ab-message">We are checking whether an ad blocker is active. If you have whitelisted this site, click <strong>Re-check</strong> or reload.</p>
    <div id="ab-actions">
      <button id="ab-recheck" type="button">Re-check</button>
      <button id="ab-reload" type="button">Reload page</button>
      <a id="ab-whitelist-instr" href="#" target="_blank" rel="noopener">How to whitelist</a>
    </div>
  </div>
</div>

<div id="ab-watermark" aria-hidden="true">ADBLOCK DETECTED</div>

<style>
  /* Overlay covers entire screen by default (blocks content until detection finishes) */
  #ab-overlay {
    display: flex; /* visible by default */
    position: fixed;
    inset: 0;
    z-index: 999999;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: opacity 260ms ease;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }

  #ab-modal {
    max-width: 560px;
    width: calc(100% - 48px);
    background: rgba(255,255,255,0.03);
    padding: 22px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  #ab-modal h2 {
    margin: 0 0 8px;
    font-size: 1.25rem;
    letter-spacing: -.01em;
  }
  #ab-modal p { margin: 0 0 14px; color: #eee; }

  #ab-actions { display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; }
  #ab-actions button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 0;
    cursor: pointer;
    background: rgba(255,255,255,0.12);
    color: white;
    font-weight: 600;
  }
  #ab-actions a {
    color: rgba(255,255,255,0.88);
    font-size: .9rem;
    text-decoration: underline;
  }

  /* Watermark (shown only when adblock is detected) */
  #ab-watermark {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999998;
    pointer-events: none;
  }
  #ab-watermark::before {
    content: "ADBLOCK DETECTED";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-25deg);
    font-size: 9vw;
    color: rgba(255, 0, 0, 0.08);
    font-weight: 800;
    white-space: nowrap;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* When locked, make page (under overlay) visually blurred and not interactable */
  body.ab-locked > *:not(#ab-overlay):not(#ab-watermark) {
    filter: blur(5px) saturate(.95);
    pointer-events: none;
    user-select: none;
  }

  /* Transition-out helpers */
  .ab-hide {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  @media (max-width:420px){
    #ab-modal { padding: 16px; }
    #ab-actions { gap:8px; }
  }
</style>
