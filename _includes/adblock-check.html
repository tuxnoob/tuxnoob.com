<style>
#adblock-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  background: rgba(0, 0, 0, 0.7);
  z-index: 9999;
}
#adblock-overlay .content {
  color: white;
  text-align: center;
  font-size: 24px;
  position: relative;
}
#adblock-overlay::before {
  content: 'CONTENT BLOCKED';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-30deg);
  font-size: 80px;
  color: rgba(255, 255, 255, 0.05);
  white-space: nowrap;
  pointer-events: none;
}
</style>

<div id="adblock-overlay">
  <div class="content">
    <h1>AdBlock Detected</h1>
    <p>Please disable your ad blocker to view this content and the ads will not bother you.</p>
  </div>
</div>

<script>
(function(){
  const overlay = document.getElementById('adblock-overlay');

  function showOverlay() {
    overlay.style.display = 'flex';
  }
  function hideOverlay() {
    overlay.remove();
  }

  function checkAdblock() {
    let adblockDetected = false;

    // Test 1: Bait script loading
    const baitScript = document.createElement('script');
    baitScript.src = '/ads/ad-banner.js?' + Date.now();
    baitScript.onerror = function() {
      adblockDetected = true;
      showOverlay();
    };
    document.head.appendChild(baitScript);

    // Test 2: CSS hiding rule
    const baitDiv = document.createElement('div');
    baitDiv.className = 'ads ad-unit ad-banner ad-container';
    baitDiv.style.height = '1px';
    document.body.appendChild(baitDiv);

    setTimeout(() => {
      const baitHidden = !baitDiv.offsetParent || baitDiv.offsetHeight === 0;
      baitDiv.remove();

      if (baitHidden) adblockDetected = true;

      // Show/hide overlay depending on detection
      if (adblockDetected) {
        showOverlay();
      } else {
        hideOverlay();
      }
    }, 500);
  }

  // Run detection after DOM ready
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(checkAdblock, 200);
  } else {
    document.addEventListener('DOMContentLoaded', () => setTimeout(checkAdblock, 200));
  }
})();
</script>
