<div id="adblock-overlay" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(8px);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
">
  <div style="position: absolute; top: 50%; left: 50%;
              transform: translate(-50%, -50%);
              font-size: 4rem; font-weight: bold;
              color: rgba(0,0,0,0.1);
              pointer-events: none;
              white-space: nowrap;
              user-select: none;">
    PLEASE DISABLE ADBLOCK
  </div>
  <div style="z-index: 10000; position: relative;">
    <h2 style="color: #000;">AdBlock Detected</h2>
    <p style="max-width: 400px; margin: auto;">
      We noticed you’re using an ad blocker. Please disable it to access our content and it won't bother you when you read it.
    </p>
    <button id="adblock-recheck" style="margin-top: 10px; padding: 8px 15px;">
      Re-check
    </button>
    <button id="adblock-reload" style="margin-top: 10px; padding: 8px 15px;">
      Reload Page
    </button>
  </div>
</div>
