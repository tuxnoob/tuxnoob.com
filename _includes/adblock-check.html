<style>
  #adblock-warning {
    display: none;
    font-family: sans-serif;
    text-align: center;
    padding: 50px;
    font-size: 20px;
    background: #fff;
    color: #000;
    min-height: 100vh;
  }
  body.adblock-detected > *:not(#adblock-warning) {
    display: none !important;
  }
  body.adblock-detected #adblock-warning {
    display: block;
  }
</style>

<div id="adblock-warning">
  🚫 We've detected you are using an ad blocker.<br><br>
  Please disable it to view our content, and the ads will not bother you. Thanks
</div>

<script>
(function(){
  var bait = document.createElement('script');
  bait.src = '/assets/js/ads.js'; // Our bait file
  bait.onerror = function() {
    document.body.classList.add('adblock-detected');
  };
  document.head.appendChild(bait);

  // Safety timeout in case the adblocker hides the script silently
  setTimeout(function(){
    var scripts = Array.from(document.getElementsByTagName('script'));
    var found = scripts.some(s => s.src.includes('ads.js'));
    if (!found) {
      document.body.classList.add('adblock-detected');
    }
  }, 500);
})();
</script>
