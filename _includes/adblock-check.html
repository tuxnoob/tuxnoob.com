<style>
  /* Full screen overlay */
  #adblock-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 99999;
    justify-content: center;
    align-items: center;
  }

  /* Modal box */
  #adblock-modal {
    background: white;
    color: black;
    padding: 30px 40px;
    max-width: 400px;
    text-align: center;
    border-radius: 12px;
    font-family: sans-serif;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  #adblock-modal h2 {
    margin-top: 0;
    font-size: 24px;
  }

  #adblock-modal p {
    font-size: 16px;
    margin-bottom: 0;
  }
</style>

<div id="adblock-overlay">
  <div id="adblock-modal">
    <h2>🚫 Ad Blocker Detected</h2>
    <p>
      We've detected you are using an ad blocker.<br>
      Please disable it to view our content, and the ads will not bother you. Thanks
    </p>
  </div>
</div>

<script>
(function(){
  var bait = document.createElement('script');
  bait.src = '/ads/ad-banner.js'; // Our bait file
  bait.onerror = function() {
    document.getElementById('adblock-overlay').style.display = 'flex';
  };
  document.head.appendChild(bait);

  // Fallback in case adblock removes the script silently
  setTimeout(function(){
    var scripts = Array.from(document.getElementsByTagName('script'));
    var found = scripts.some(s => s.src.includes(ad-banner.js'));
    if (!found) {
      document.getElementById('adblock-overlay').style.display = 'flex';
    }
  }, 500);
})();
</script>
