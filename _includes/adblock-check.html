<!-- Adblock Overlay -->
<div id="adblock-overlay" style="
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    backdrop-filter: blur(6px);
    background: rgba(255,255,255,0.8);
    z-index: 9999;
    text-align: center;
    padding-top: 20vh;
">
    <div style="position: relative;">
        <div style="
            font-size: 80px;
            color: rgba(0,0,0,0.05);
            position: absolute;
            top: -150px;
            left: 0;
            width: 100%;
            transform: rotate(-30deg);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        ">
            PLEASE DISABLE ADBLOCK
        </div>
        <h2 style="color:#000;">AdBlock Detected</h2>
        <p style="color:#333;">Please disable your ad blocker to view this site and it won't bother you when you read it.</p>
        <button id="recheck-adblock" style="
            padding: 10px 20px;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        ">I disabled AdBlock, re-check</button>
    </div>
</div>

<!-- Blur effect for content -->
<style>
    body.adblock-active main,
    body.adblock-active #content {
        filter: blur(6px);
        pointer-events: none;
        user-select: none;
    }
</style>
