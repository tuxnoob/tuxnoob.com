<style>
  body.adblock-detected {
    display: none !important;
  }
  #adblock-warning {
    display: none;
    font-family: sans-serif;
    text-align: center;
    padding: 50px;
    font-size: 20px;
    background: #fff;
    color: #000;
    min-height: 100vh;
  }
  body.adblock-detected #adblock-warning {
    display: block !important;
  }
</style>

<div id="adblock-warning">
  🚫 We've detected you are using an ad blocker.<br><br>
  Please disable it to view our content, and the ads will not bother you. Thanks
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var adTest = document.createElement("div");
    adTest.className = "adsbox";
    adTest.style.height = "1px";
    document.body.appendChild(adTest);

    setTimeout(function () {
      if (adTest.offsetHeight === 0) {
        document.body.classList.add("adblock-detected");
      }
      adTest.remove();
    }, 100);
  });
</script>
