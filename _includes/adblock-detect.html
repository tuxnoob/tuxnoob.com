<script>
(function(){
  function detectAdblock(callback) {
    // Create bait element
    var bait = document.createElement('div');
    bait.className = 'adsbox';
    bait.style.position = 'absolute';
    bait.style.left = '-999px';
    document.body.appendChild(bait);

    window.setTimeout(function() {
      var blocked = false;
      if (bait.offsetHeight === 0) blocked = true;
      document.body.removeChild(bait);
      callback(blocked);
    }, 100);
  }

  function showOverlay() {
    document.getElementById('adblock-overlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function hideOverlay() {
    document.getElementById('adblock-overlay').style.display = 'none';
    document.body.style.overflow = '';
  }

  function checkAndToggle() {
    detectAdblock(function(isBlocked) {
      if (isBlocked) {
        showOverlay();
      } else {
        hideOverlay();
      }
    });
  }

  // Initial check
  document.addEventListener('DOMContentLoaded', function() {
    checkAndToggle();

    // Re-check button
    document.getElementById('adblock-recheck').addEventListener('click', function(){
      checkAndToggle();
    });

    // Reload button
    document.getElementById('adblock-reload').addEventListener('click', function(){
      location.reload();
    });
  });
})();
</script>
