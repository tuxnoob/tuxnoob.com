<style>
  body.adblock-detected {
    filter: blur(5px);
    overflow: hidden;
  }
  #adblock-overlay {
    display: none;
    position: fixed;
    z-index: 99999;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    color: white;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  #adblock-watermark {
    display: none;
    position: fixed;
    z-index: 99998;
    bottom: 10px; right: 10px;
    color: rgba(255,255,255,0.3);
    font-size: 1rem;
    pointer-events: none;
  }
</style>

<div id="adblock-overlay">
  <div>
    <h2>Please disable your AdBlocker</h2>
    <p>We rely on ads to keep this site running and the ads will not bother you. Please whitelist us and reload.</p>
  </div>
</div>
<div id="adblock-watermark">AdBlock detected</div>

<script>
(function(){
  function showOverlay() {
    document.body.classList.add('adblock-detected');
    document.getElementById('adblock-overlay').style.display = 'flex';
    document.getElementById('adblock-watermark').style.display = 'block';
  }

  // Method 1: Known-blocked script filename (EasyList)
  var baitScript = document.createElement('script');
  baitScript.src = '/ads/adsbygoogle.js';
  baitScript.onerror = function() {
    showOverlay();
  };
  document.head.appendChild(baitScript);

  // Method 2: Hidden bait element with ad-related classnames
  var baitDiv = document.createElement('div');
  baitDiv.className = 'adsbox banner adunit ad-banner';
  baitDiv.style.height = '1px';
  baitDiv.style.position = 'absolute';
  baitDiv.style.left = '-999px';
  document.body.appendChild(baitDiv);

  setTimeout(function(){
    var elementBlocked = (baitDiv.offsetHeight === 0);
    if (elementBlocked) {
      showOverlay();
    }
    baitDiv.remove();
  }, 300);
})();
</script>
