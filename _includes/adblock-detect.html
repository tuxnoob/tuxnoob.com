<script>
function detectAdblock(callback) {
  let bait = document.createElement('div');
  bait.className = 'adsbox banner_ad';
  bait.style.position = 'absolute';
  bait.style.height = '1px';
  bait.style.width = '1px';
  bait.style.left = '-999px';
  document.body.appendChild(bait);

  setTimeout(() => {
    let blockedByCss = (window.getComputedStyle(bait).display === 'none' || bait.offsetParent === null);
    bait.remove();

    let script = document.createElement('script');
    script.src = '/ads.js';
    script.async = true;
    script.onerror = () => callback(true); // blocked
    script.onload = () => callback(blockedByCss);
    document.body.appendChild(script);
  }, 300);
}

function showOverlay() {
  document.getElementById('adblock-overlay').style.display = 'flex';
}

function hideOverlay() {
  document.getElementById('adblock-overlay').style.display = 'none';
}

function runDetection() {
  detectAdblock((blocked) => {
    if (blocked) {
      showOverlay();
    } else {
      hideOverlay();
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  runDetection();
  document.getElementById('adblock-recheck').addEventListener('click', runDetection);
});
</script>
